name: Cloud Autonomous Batch Uploader (Zero-PC)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source GitHub Run ID containing rendered video artifacts'
        required: true
        default: '40514508384'

jobs:
  cloud_upload:
    name: Cloud Batch Studio Uploader
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Verify Runner Media & Display Tools
        run: |
          which ffmpeg || sudo apt-get install -y ffmpeg
          which xvfb-run || sudo apt-get install -y xvfb

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright requests cryptography

      - name: 🌐 Install Playwright & Browsers
        run: |
          playwright install chromium --with-deps
          playwright install chrome --with-deps || true

      - name: 🔐 Decrypt & Unpack Authenticated Channel Profiles & Session Cookies
        env:
          MASTER_KEY: ${{ secrets.CH_PROFILE_SECRET_KEY }}
        run: |
          mkdir -p /tmp/chrome_user_data_ch01 /tmp/chrome_user_data_ch02
          if [ -f "credentials/profile_ch_01.tar.gz.enc" ] && [ -n "$MASTER_KEY" ]; then
            python decrypt_profile.py "$MASTER_KEY" "credentials/profile_ch_01.tar.gz.enc" /tmp/p1.tar.gz
            tar -xzf /tmp/p1.tar.gz -C /tmp/chrome_user_data_ch01
            echo "✓ CH01 Profile Unpacked"
          fi
          if [ -f "credentials/profile_ch_02.tar.gz.enc" ] && [ -n "$MASTER_KEY" ]; then
            python decrypt_profile.py "$MASTER_KEY" "credentials/profile_ch_02.tar.gz.enc" /tmp/p2.tar.gz
            tar -xzf /tmp/p2.tar.gz -C /tmp/chrome_user_data_ch02
            echo "✓ CH02 Profile Unpacked"
          fi
          # Decrypt and copy authenticated session cookies (DPAPI bypass)
          if [ -f "credentials/storage_state_ch_01.json.enc" ] && [ -n "$MASTER_KEY" ]; then
            python decrypt_profile.py "$MASTER_KEY" "credentials/storage_state_ch_01.json.enc" credentials/storage_state_ch_01.json
            cp credentials/storage_state_ch_01.json /tmp/storage_state_ch_01.json
            echo "✓ CH01 Session Cookies Decrypted & Loaded to /tmp"
          fi
          if [ -f "credentials/storage_state_ch_02.json.enc" ] && [ -n "$MASTER_KEY" ]; then
            python decrypt_profile.py "$MASTER_KEY" "credentials/storage_state_ch_02.json.enc" credentials/storage_state_ch_02.json
            cp credentials/storage_state_ch_02.json /tmp/storage_state_ch_02.json
            echo "✓ CH02 Session Cookies Decrypted & Loaded to /tmp"
          fi

      - name: 🚀 Execute Cloud Batch Uploader to YouTube Studio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CH_PROFILE_DIR_CH01: /tmp/chrome_user_data_ch01
          CH_PROFILE_DIR_CH02: /tmp/chrome_user_data_ch02
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python cloud_batch_uploader.py ${{ github.event.inputs.run_id || '40514508384' }}

      - name: 📸 Preserve Diagnostic Screenshots & Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploader-diagnostics
          path: |
            renders/*.png
            renders/debug_*.png
            renders/*upload_manifest.json
          if-no-files-found: ignore
