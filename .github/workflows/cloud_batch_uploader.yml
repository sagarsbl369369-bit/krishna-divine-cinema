name: Cloud Autonomous Batch Uploader (Zero-PC)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source GitHub Run ID containing rendered video artifacts'
        required: true
        default: '40514508384'

jobs:
  cloud_upload:
    name: Cloud Batch Studio Uploader
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 Install FFmpeg, Xvfb & Indian Devanagari Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb fonts-noto-hinted fonts-deva

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright requests cryptography

      - name: 🌐 Install Playwright & Real Google Chrome
        run: |
          playwright install chrome --with-deps || playwright install chromium --with-deps

      - name: 🔐 Decrypt & Unpack Authenticated Channel Profiles
        env:
          MASTER_KEY: ${{ secrets.CH_PROFILE_SECRET_KEY }}
        run: |
          mkdir -p /tmp/chrome_user_data_ch01 /tmp/chrome_user_data_ch02
          if [ -f "credentials/profile_ch_01.tar.gz.enc" ] && [ -n "$MASTER_KEY" ]; then
            python decrypt_profile.py "$MASTER_KEY" "credentials/profile_ch_01.tar.gz.enc" /tmp/p1.tar.gz
            tar -xzf /tmp/p1.tar.gz -C /tmp/chrome_user_data_ch01
            echo "✓ CH01 Profile Unpacked"
          fi
          if [ -f "credentials/profile_ch_02.tar.gz.enc" ] && [ -n "$MASTER_KEY" ]; then
            python decrypt_profile.py "$MASTER_KEY" "credentials/profile_ch_02.tar.gz.enc" /tmp/p2.tar.gz
            tar -xzf /tmp/p2.tar.gz -C /tmp/chrome_user_data_ch02
            echo "✓ CH02 Profile Unpacked"
          fi

      - name: 🚀 Execute Cloud Batch Uploader to YouTube Studio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CH_PROFILE_DIR_CH01: /tmp/chrome_user_data_ch01
          CH_PROFILE_DIR_CH02: /tmp/chrome_user_data_ch02
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python cloud_batch_uploader.py ${{ github.event.inputs.run_id || '40514508384' }}
